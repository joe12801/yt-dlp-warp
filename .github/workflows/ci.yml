name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile ytwarp.py scripts/cookie-editor-to-netscape.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell script syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/setup-warp-linux.sh scripts/warp-doctor.sh
